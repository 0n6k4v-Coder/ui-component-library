<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Transparent Navbar</title>
  <link rel="stylesheet" href="./transparent-responsive-navbar.css" />
</head>

<body>
  <header class="site-header">
    <div class="navbar">
      <!-- ========================================================
           LOGO
           ======================================================== -->

      <a href="#" class="logo" data-i18n="logo">Logo</a>

      <!-- ========================================================
           DESKTOP NAVIGATION
           ======================================================== -->

      <nav class="nav-right" aria-label="Primary navigation">
        <div class="menu-group">
          <a href="#" class="nav-link" data-i18n="menu1">Menu 1</a>
          <a href="#" class="nav-link" data-i18n="menu2">Menu 2</a>
          <a href="#" class="nav-link" data-i18n="menu3">Menu 3</a>
        </div>

        <span class="nav-divider" aria-hidden="true"></span>

        <div class="utility-group">
          <!-- Desktop Language -->
          <div class="language-control">
            <button class="icon-control language-trigger" type="button" aria-label="Change language" aria-haspopup="menu" aria-expanded="false" popovertarget="language-menu" popovertargetaction="toggle" data-language-trigger>
              <svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                  <clipPath id="globe-clip-desktop">
                    <circle cx="12" cy="12" r="8.15" />
                  </clipPath>
                </defs>
                <circle cx="12" cy="12" r="9" />
                <g clip-path="url(#globe-clip-desktop)">
                  <path d="M3 9h18M3 15h18M12 3a15.3 15.3 0 0 1 4 9a15.3 15.3 0 0 1-4 9a15.3 15.3 0 0 1-4-9a15.3 15.3 0 0 1 4-9Z" />
                </g>
              </svg>
            </button>

            <div id="language-menu" class="language-dropdown" popover="auto" role="menu" data-language-menu>
              <button class="language-option" type="button" role="menuitem" data-lang="en" aria-current="true">ENG</button>
              <button class="language-option" type="button" role="menuitem" data-lang="th" aria-current="false">ไทย</button>
            </div>
          </div>

          <!-- Desktop Theme -->
          <div class="theme-control">
            <button class="icon-control" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" data-theme-trigger>
              <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.3 15.8A8.2 8.2 0 0 1 8.2 3.7A8.7 8.7 0 1 0 20.3 15.8Z" />
              </svg>
              <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2.5v2M12 19.5v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.5 12h2M19.5 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4" />
              </svg>
            </button>
          </div>
        </div>
      </nav>

      <!-- ========================================================
           MOBILE TRIGGER
           ======================================================== -->

      <button class="mobile-trigger" type="button" aria-label="Open menu" popovertarget="mobile-menu" popovertargetaction="show" data-mobile-menu-trigger>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ==========================================================
       MOBILE OVERLAY
       ========================================================== -->

  <div id="mobile-menu" class="mobile-overlay" popover="auto" aria-label="Mobile navigation" data-mobile-menu>
    <div class="mobile-overlay-content">
      <!-- Top -->
      <div class="mobile-overlay-top">
        <button class="mobile-close-button" type="button" aria-label="Close menu" popovertarget="mobile-menu" popovertargetaction="hide">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5l14 14M19 5L5 19" />
          </svg>
        </button>
      </div>

      <!-- Middle -->
      <div class="mobile-overlay-middle">
        <nav class="mobile-menu-group" aria-label="Mobile navigation">
          <a href="#" class="mobile-menu-link" data-i18n="menu1" data-mobile-menu-link>Menu 1</a>
          <a href="#" class="mobile-menu-link" data-i18n="menu2" data-mobile-menu-link>Menu 2</a>
          <a href="#" class="mobile-menu-link" data-i18n="menu3" data-mobile-menu-link>Menu 3</a>
        </nav>
      </div>

      <!-- Bottom -->
      <div class="mobile-overlay-bottom">
        <!-- Mobile Language Menu -->
        <div class="mobile-language-menu" role="menu" data-mobile-language-menu>
          <button class="language-option" type="button" role="menuitem" data-lang="en" aria-current="true">ENG</button>
          <button class="language-option" type="button" role="menuitem" data-lang="th" aria-current="false">ไทย</button>
        </div>

        <!-- Mobile Utility Actions -->
        <div class="mobile-actions">
          <!-- Language -->
          <button class="mobile-icon-control" type="button" aria-label="Change language" aria-haspopup="menu" aria-expanded="false" data-mobile-language-trigger>
            <svg class="language-icon" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <clipPath id="globe-clip-mobile">
                  <circle cx="12" cy="12" r="8.15" />
                </clipPath>
              </defs>
              <circle cx="12" cy="12" r="9" />
              <g clip-path="url(#globe-clip-mobile)">
                <path d="M3 9h18M3 15h18M12 3a15.3 15.3 0 0 1 4 9a15.3 15.3 0 0 1-4 9a15.3 15.3 0 0 1-4-9a15.3 15.3 0 0 1 4-9Z" />
              </g>
            </svg>
          </button>

          <!-- Theme -->
          <button class="mobile-icon-control theme-control" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" data-theme-trigger>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.3 15.8A8.2 8.2 0 0 1 8.2 3.7A8.7 8.7 0 1 0 20.3 15.8Z" />
            </svg>
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2.5v2M12 19.5v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.5 12h2M19.5 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <main></main>

  <script src="./transparent-responsive-navbar.js"></script>
</body>
</html>
